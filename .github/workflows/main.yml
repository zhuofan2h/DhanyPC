# Nama: RDP dengan Backup State Profil & Sistem Penuh
# Dibuat berdasarkan rencana pengguna untuk mencadangkan folder sistem dan profil pengguna.
# PERINGATAN: Proses ini akan memakan waktu lama dan berisiko karena ukuran folder yang besar dan potensi file terkunci.
name: RDP Full Profile & System Backup

on:
  workflow_dispatch:

jobs:
  persistent-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install rclone
        shell: powershell
        run: |
          echo "Installing Chocolatey and rclone..."
          Set-ExecutionPolicy Bypass -Scope Process -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          choco install rclone -y -f
          echo "rclone installed."

      - name: 3. Setup rclone Config from Secret
        shell: powershell
        run: |
          echo "Creating rclone config directory..."
          $configPath = "C:\Users\runneradmin\.config\rclone"
          New-Item -ItemType Directory -Force -Path $configPath
          echo "Writing rclone.conf using PowerShell here-string..."
          Set-Content -Path "$configPath\rclone.conf" -Value @"
          ${{ secrets.RCLONE_CONF }}
          "@
          echo "rclone.conf successfully written."

      - name: 4. Restore Full User & System State from Cloud
        shell: powershell
        run: |
          echo "--- Starting Full State Restore ---"
          $userPath = "C:\Users\runneradmin"
          
          # Restore folder sistem dan aplikasi
          echo "Restoring Program Files, Program Files (x86), and AppData..."
          rclone copy gdrive:/RDP_Backup/ProgramFiles "C:\Program Files" --progress --transfers 8 --checkers 16
          rclone copy gdrive:/RDP_Backup/ProgramFilesx86 "C:\Program Files (x86)" --progress --transfers 8 --checkers 16
          rclone copy gdrive:/RDP_Backup/AppData "$userPath\AppData" --progress --transfers 8 --checkers 16

          # Restore folder profil pengguna
          echo "Restoring Desktop, Documents, Downloads, Pictures, and Videos..."
          rclone copy gdrive:/RDP_Backup/Desktop "$userPath\Desktop" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/Documents "$userPath\Documents" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/Downloads "$userPath\Downloads" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/Pictures "$userPath\Pictures" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/Videos "$userPath\Videos" --progress --create-empty-src-dirs

          # Restore dan impor registry
          echo "Restoring and importing registry..."
          rclone copy gdrive:/RDP_Backup/registry/HKCU.reg "$userPath\HKCU.reg" -P
          if (Test-Path "$userPath\HKCU.reg") {
            reg import "$userPath\HKCU.reg"
          }
          echo "--- Restore Complete ---"

      - name: 5. Configure RDP & Connect Tailscale
        shell: powershell
        run: |
          # Konfigurasi pengguna RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"
          $env:RDP_PASSWORD="User123"
          
          # Install dan hubungkan Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$($env:GITHUB_RUN_ID)
          
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
            $tsIP = tailscale ip -4
            Start-Sleep -Seconds 5; $retries++
          }
          if (-not $tsIP) { throw "Tailscale IP not assigned." }
          
          # Tampilkan info koneksi
          Write-Host "`n=== RDP ACCESS READY ===" -ForegroundColor Green
          Write-Host "Address: $tsIP"
          Write-Host "Username: dhasap"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================`n"
          
          # Tahan koneksi
          while ($true) { Start-Sleep -Seconds 300 }

      - name: 6. Backup Full User & System State to Cloud (Always Runs)
        if: always()
        shell: powershell
        run: |
          echo "--- Starting Full State Backup ---"
          $userPath = "C:\Users\runneradmin"
          
          # Backup folder sistem dan aplikasi
          echo "Backing up Program Files, Program Files (x86), and AppData..."
          rclone copy "C:\Program Files" gdrive:/RDP_Backup/ProgramFiles --progress --transfers 8 --checkers 16
          rclone copy "C:\Program Files (x86)" gdrive:/RDP_Backup/ProgramFilesx86 --progress --transfers 8 --checkers 16
          rclone copy "$userPath\AppData" gdrive:/RDP_Backup/AppData --progress --transfers 8 --checkers 16

          # Backup folder profil pengguna
          echo "Backing up Desktop, Documents, Downloads, Pictures, and Videos..."
          rclone copy "$userPath\Desktop" gdrive:/RDP_Backup/Desktop -P
          rclone copy "$userPath\Documents" gdrive:/RDP_Backup/Documents -P
          rclone copy "$userPath\Downloads" gdrive:/RDP_Backup/Downloads -P
          rclone copy "$userPath\Pictures" gdrive:/RDP_Backup/Pictures -P
          rclone copy "$userPath\Videos" gdrive:/RDP_Backup/Videos -P

          # Ekspor dan backup registry
          echo "Exporting and backing up registry..."
          reg export HKCU "$userPath\HKCU.reg" /y
          rclone copy "$userPath\HKCU.reg" gdrive:/RDP_Backup/registry -P
          
          echo "--- Backup Complete ---"

