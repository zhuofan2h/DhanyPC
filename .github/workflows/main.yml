# Nama: RDP dengan Backup Profil Pengguna yang Dioptimalkan
# Versi ini jauh lebih cepat dengan fokus pada folder pengguna dan mengecualikan cache.
name: RDP Optimized User Profile Backup

on:
  workflow_dispatch:

jobs:
  persistent-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install rclone
        shell: powershell
        run: |
          echo "Installing Chocolatey and rclone..."
          Set-ExecutionPolicy Bypass -Scope Process -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          choco install rclone -y -f
          echo "rclone installed."

      - name: 3. Setup rclone Config from Secret
        shell: powershell
        run: |
          echo "Creating rclone config directory..."
          $configPath = "C:\Users\runneradmin\.config\rclone"
          New-Item -ItemType Directory -Force -Path $configPath
          echo "Writing rclone.conf using PowerShell here-string..."
          Set-Content -Path "$configPath\rclone.conf" -Value @"
          ${{ secrets.RCLONE_CONF }}
          "@
          echo "rclone.conf successfully written."

      - name: 4. Restore User Profile & Registry from Cloud (SAFE METHOD)
        shell: powershell
        run: |
          echo "--- Starting Safe Restore ---"
          $userPath = "C:\Users\runneradmin"
          
          # PERBAIKAN: Restore folder-folder penting satu per satu, hindari sync seluruh AppData.
          # Kita menggunakan 'copy' untuk keamanan tambahan.
          echo "Restoring Desktop, Documents, Downloads, Pictures, Videos..."
          rclone copy gdrive:/RDP_Backup/UserData/Desktop "$userPath\Desktop" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/UserData/Documents "$userPath\Documents" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/UserData/Downloads "$userPath\Downloads" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/UserData/Pictures "$userPath\Pictures" --progress --create-empty-src-dirs
          rclone copy gdrive:/RDP_Backup/UserData/Videos "$userPath\Videos" --progress --create-empty-src-dirs
          
          # Hanya restore AppData\Roaming, yang berisi konfigurasi dan lebih aman.
          echo "Restoring AppData\Roaming for application settings..."
          rclone copy gdrive:/RDP_Backup/UserData/AppData/Roaming "$userPath\AppData\Roaming" --progress --create-empty-src-dirs

          # Restore dan impor registry
          echo "Restoring and importing registry..."
          rclone copy gdrive:/RDP_Backup/registry/HKCU.reg "$userPath\HKCU.reg" -P
          if (Test-Path "$userPath\HKCU.reg") {
            reg import "$userPath\HKCU.reg"
          }
          echo "--- Restore Complete ---"

      - name: 5. Configure RDP & Connect Tailscale
        shell: powershell
        run: |
          # Konfigurasi pengguna RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"
          $env:RDP_PASSWORD="User123"
          
          # Install dan hubungkan Tailscale
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$($env:GITHUB_RUN_ID)
          
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
            $tsIP = tailscale ip -4
            Start-Sleep -Seconds 5; $retries++
          }
          if (-not $tsIP) { throw "Tailscale IP not assigned." }
          
          # Tampilkan info koneksi
          Write-Host "`n=== RDP ACCESS READY ===" -ForegroundColor Green
          Write-Host "Address: $tsIP"
          Write-Host "Username: dhasap"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================`n"
          
          # Tahan koneksi
          while ($true) { Start-Sleep -Seconds 300 }

      - name: 6. Backup User Profile & Registry to Cloud (Always Runs)
        if: always()
        shell: powershell
        run: |
          echo "--- Starting Optimized Backup ---"
          $userPath = "C:\Users\runneradmin"
          
          # Ekspor registry terlebih dahulu
          echo "Exporting registry..."
          reg export HKCU "$userPath\HKCU.reg" /y
          
          # Backup seluruh profil pengguna dengan mengecualikan cache dan file sementara
          echo "Backing up User Profile with exclusions..."
          rclone sync $userPath gdrive:/RDP_Backup/UserData --progress --transfers 8 --checkers 16 `
            --exclude "AppData/Local/Temp/**" `
            --exclude "AppData/LocalLow/Temp/**" `
            --exclude "AppData/Local/Google/Chrome/User Data/Default/Cache/**" `
            --exclude "AppData/Local/Microsoft/Edge/User Data/Default/Cache/**" `
            --exclude "AppData/Local/Microsoft/Windows/INetCache/**" `
            --exclude "Downloads/**.tmp" `
            --exclude "NTUSER.DAT*"

          # Backup file registry secara terpisah
          echo "Backing up registry file..."
          rclone copy "$userPath\HKCU.reg" gdrive:/RDP_Backup/registry -P
          
          echo "--- Backup Complete ---"

