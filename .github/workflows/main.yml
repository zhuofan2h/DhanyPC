name: RDP with Persistent Storage

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup rclone and Load Config
        run: |
          echo "Installing rclone..."
          choco install rclone -y
          echo "Creating rclone config directory..."
          $configPath = "C:\Users\runneradmin\.config\rclone"
          New-Item -ItemType Directory -Force -Path $configPath
          echo "Writing rclone config from secret..."
          # Cara ini memastikan format multiline tetap terjaga
          Add-Content -Path "$configPath\rclone.conf" -Value "${{ secrets.RCLONE_CONF }}"
          echo "rclone setup complete. Verifying config:"
          rclone config show

      - name: Restore Persistent Data from Cloud
        run: |
          echo "Creating persistent directory..."
          $persistPath = "C:\Users\runneradmin\Desktop\persist"
          New-Item -ItemType Directory -Force -Path $persistPath
          echo "Restoring data from cloud..."
          # Menggunakan 'gdrive' sebagai nama remote
          # 'RDP_Backup' adalah nama folder di Google Drive Anda
          rclone copy gdrive:/RDP_Backup $persistPath --progress

      - name: Configure Core RDP & User
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"
          echo "RDP_PASSWORD=User123" >> $env:GITHUB_ENV

      - name: Install and Connect Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = tailscale ip -4
              Start-Sleep -Seconds 5; $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Start RDP Session & Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: dhasap"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Persistent Folder: C:\Users\runneradmin\Desktop\persist"
          Write-Host "==================`n"
          while ($true) { Start-Sleep -Seconds 300 }

      - name: Backup Persistent Data to Cloud
        if: always() # Selalu jalankan langkah ini
        run: |
          echo "Backing up data to cloud..."
          # Menggunakan 'sync' untuk efisiensi, hanya mengunggah file yang berubah
          rclone sync C:\Users\runneradmin\Desktop\persist gdrive:/RDP_Backup --progress

