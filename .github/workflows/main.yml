name: RDP Session

on:
  workflow_dispatch:

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Configure RDP & Connect Tailscale
        shell: powershell
        run: |
          # ── Konfigurasi RDP ──────────────────────────────────────────────
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"

          # ── Install & Hubungkan Tailscale ────────────────────────────────
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$($env:GITHUB_RUN_ID)

          # Tunggu Tailscale IP
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 12) {
            $tsIP = tailscale ip -4
            if (-not $tsIP) { Start-Sleep -Seconds 5; $retries++ }
          }
          if (-not $tsIP) { throw "Tailscale IP tidak berhasil didapat." }

          # ── Kirim notifikasi RDP siap ke Telegram ────────────────────────
          $botToken  = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chatId    = "${{ secrets.TELEGRAM_CHAT_ID }}"
          $runId     = $env:GITHUB_RUN_ID
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
          $endTime   = (Get-Date).AddMinutes(355).ToString("yyyy-MM-dd HH:mm:ss UTC")

          $msgReady  = "RDP SIAP`n`nAlamat  : $tsIP`nUsername: dhasap`nPassword: User123`n`nMulai   : $startTime`nBerakhir: $endTime`nRun ID  : $runId"
          $body = [System.Text.Encoding]::UTF8.GetBytes(("{""chat_id"":""{0}"",""text"":""{1}""}" -f $chatId, ($msgReady -replace '"','\"' -replace "`n",'\n')))
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $body

          Write-Host "=== RDP ACCESS READY ===" -ForegroundColor Green
          Write-Host "Address : $tsIP"
          Write-Host "Username: dhasap"
          Write-Host "Password: User123"

          # ── Loop monitor waktu ───────────────────────────────────────────
          $loopStart  = Get-Date
          $maxMinutes = 355
          $interval   = 1800
          $nextUpdate = (Get-Date).AddSeconds($interval)

          while ($true) {
            Start-Sleep -Seconds 60
            $elapsed   = (Get-Date) - $loopStart
            $remaining = $maxMinutes - [int]$elapsed.TotalMinutes

            if ($remaining -le 0) {
              Write-Host "Waktu sesi habis. Mengakhiri..." -ForegroundColor Yellow
              break
            }

            if ((Get-Date) -ge $nextUpdate) {
              $hours   = [math]::Floor($remaining / 60)
              $mins    = $remaining % 60
              $timeNow = Get-Date -Format "HH:mm:ss"
              Write-Host "[$timeNow] Sisa waktu: ${hours}j ${mins}m"

              $msgUpd = "Update Sesi RDP`n`nWaktu   : $timeNow UTC`nSisa    : $hours jam $mins menit`nRun ID  : $runId"
              $bodyUpd = [System.Text.Encoding]::UTF8.GetBytes(("{""chat_id"":""{0}"",""text"":""{1}""}" -f $chatId, ($msgUpd -replace '"','\"' -replace "`n",'\n')))
              Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $bodyUpd

              $nextUpdate = (Get-Date).AddSeconds($interval)
            }
          }

      - name: 3. Notifikasi Sesi Berakhir
        if: always()
        shell: powershell
        run: |
          $botToken = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          $chatId   = "${{ secrets.TELEGRAM_CHAT_ID }}"
          $runId    = $env:GITHUB_RUN_ID
          $endTime  = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"

          $msgEnd = "SESI RDP BERAKHIR`n`nWaktu berakhir: $endTime`nRun ID        : $runId`n`nGunakan /rdp untuk memulai sesi baru."
          $body = [System.Text.Encoding]::UTF8.GetBytes(("{""chat_id"":""{0}"",""text"":""{1}""}" -f $chatId, ($msgEnd -replace '"','\"' -replace "`n",'\n')))
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $body
