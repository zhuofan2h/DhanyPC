name: Generate rclone Config

on:
  workflow_dispatch:

jobs:
  create-config:
    runs-on: windows-latest
    steps:
      - name: Install rclone
        run: choco install rclone -y

      - name: Setup RDP User & Connection via Tailscale
        run: |
          # Konfigurasi RDP dan pengguna
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"

          # --- PERBAIKAN DIMULAI DI SINI ---
          # Install Tailscale dan tunggu sampai selesai
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          # Tambahkan direktori Tailscale ke PATH untuk sesi ini
          $env:Path += ";C:\Program Files\Tailscale"
          
          # Hubungkan Tailscale (sekarang bisa dipanggil langsung)
          tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-config-$env:GITHUB_RUN_ID
          # --- AKHIR DARI PERBAIKAN ---
          
          # Tunggu IP Tailscale
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = tailscale ip -4
              Start-Sleep -Seconds 5; $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned."; exit 1 }

          # Tampilkan detail koneksi
          Write-Host "`n=== RDP ACCESS FOR RCLONE CONFIG ==="
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Username: dhasap"
          Write-Host "Password: User123"
          Write-Host "=====================================`n"
          
          # Tahan koneksi agar RDP tetap aktif untuk konfigurasi
          Start-Sleep -Seconds 3600
      
      - name: Display rclone Config on Finish
        if: always() # Selalu jalankan langkah ini, bahkan jika dibatalkan
        run: |
          Write-Host "===== RCLONE CONFIGURATION FILE (rclone.conf) ====="
          Write-Host "Copy the entire block below (from [gdrive] to the end) and save it as a GitHub Secret named RCLONE_CONF."
          # Cek apakah file ada sebelum mencoba membacanya
          $configFile = "C:\Users\runneradmin\.config\rclone\rclone.conf"
          if (Test-Path $configFile) {
              Get-Content $configFile
          } else {
              Write-Host "rclone.conf not found. Did you complete the 'rclone config' process inside RDP?"
          }
          Write-Host "================ END OF CONFIG FILE ================"

