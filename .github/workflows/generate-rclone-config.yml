name: Generate rclone Config

on:
  workflow_dispatch:

jobs:
  create-config:
    runs-on: windows-latest
    steps:
      - name: Install rclone
        run: choco install rclone -y

      - name: Setup RDP User & Connection
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="Allow RDP" dir=in action=allow protocol=TCP localport=3389
          New-LocalUser -Name "dhasap" -Password (ConvertTo-SecureString "User123" -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "dhasap"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "dhasap"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive ngrok.zip
          ./ngrok/ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ./ngrok/ngrok.exe tcp 3389 &
          Start-Sleep 10
          $ngrokUrl = (Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" | Select-Object -First 1).public_url
          Write-Host "NGROK URL: $ngrokUrl"
          Write-Host "USER: dhasap"
          Write-Host "PASSWORD: User123"
          # Tahan koneksi agar RDP tetap aktif
          Start-Sleep -Seconds 3600
      
      - name: Display rclone Config on Finish
        if: always() # Selalu jalankan langkah ini, bahkan jika dibatalkan
        run: |
          Write-Host "===== RCLONE CONFIGURATION FILE (rclone.conf) ====="
          Write-Host "Copy the entire block below (from [gdrive] to the end) and save it as a GitHub Secret named RCLONE_CONF."
          Get-Content C:\Users\runneradmin\.config\rclone\rclone.conf
          Write-Host "================ END OF CONFIG FILE ================"
```

*Catatan: Alur kerja di atas menggunakan `ngrok` untuk koneksi. Pastikan Anda sudah menambahkan `NGROK_AUTH_TOKEN` di Secrets Anda.*

### Langkah 2: Jalankan Alur Kerja dan Konfigurasi `rclone` di Dalam RDP

1.  **Jalankan Alur Kerja:** Buka tab "Actions" di GitHub dan jalankan alur kerja `Generate rclone Config`.
2.  **Masuk ke RDP:** Tunggu hingga alur kerja memberikan alamat dan kredensial RDP, lalu sambungkan dari HP Anda.
3.  **Buka PowerShell di RDP:** Setelah masuk, buka **PowerShell** (Anda bisa mencarinya di Start Menu).
4.  **Jalankan Konfigurasi `rclone`:** Ketik perintah berikut di PowerShell dan tekan Enter:
    ```powershell
    rclone config
    ```
5.  **Ikuti Proses di PowerShell (Ini Bagian Penting):**
    * `n)` New remote
    * `name>` ketik `gdrive`
    * `Storage>` pilih nomor untuk `drive` (Google Drive)
    * Tekan Enter untuk semua yang kosong (`client_id`, `client_secret`, dll.)
    * `scope>` pilih `1`
    * `Edit advanced config?` ketik `n`
    * `Use auto config?` **KETIK `n` DAN TEKAN ENTER.** Ini sangat penting karena kita tidak punya browser di RDP.
    * `rclone` akan memberikan sebuah **URL**. Salin URL tersebut.
    * **Buka URL itu di browser HP Anda.**
    * Masuk ke akun Google Anda dan berikan izin.
    * Google akan memberikan **kode verifikasi**. Salin kode itu dari HP Anda.
    * Kembali ke jendela PowerShell di RDP, **tempel (paste) kode verifikasi** tersebut dan tekan Enter.
    * `Configure this as a Shared Drive?` ketik `n`
    * `y)` Yes, this is OK.
    * `q)` Quit config.

    

### Langkah 3: Dapatkan Konfigurasi dari Log GitHub

1.  **Batalkan Alur Kerja:** Setelah konfigurasi `rclone` selesai, Anda tidak perlu menunggu sesi RDP berakhir. Kembali ke halaman GitHub Actions dan **batalkan alur kerja** (`Cancel workflow`).
2.  **Buka Log:** Klik pada alur kerja yang baru saja Anda batalkan untuk melihat lognya.
3.  **Cari Langkah Terakhir:** Buka log untuk langkah terakhir yang bernama `Display rclone Config on Finish`.
4.  **Salin Konfigurasi:** Di dalam log itu, Anda akan melihat isi dari file `rclone.conf` Anda, yang terlihat seperti ini:

    ```
    ===== RCLONE CONFIGURATION FILE (rclone.conf) =====
    Copy the entire block below (from [gdrive] to the end) and save it as a GitHub Secret named RCLONE_CONF.
    [gdrive]
    type = drive
    scope = drive
    token = {"access_token":"...","token_type":"...","...","expiry":"..."}
    ...
    ================ END OF CONFIG FILE ================

    
